<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lock Matching Practice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <!-- START SCREEN -->
        <div class="startScreen" id="startScreen">

            <h1>Select The 2 Matching Locks!</h1>

            <button
                class="startButton"
                id="startButton"
                type="button">
                START
            </button>

        </div>


        <!-- COUNTDOWN -->
        <div
            class="countdown"
            id="countdown">
            3
        </div>


        <!-- GAME -->
        <section class="gameContent">

            <h1>Select The 2 Matching Locks!</h1>

            <div class="setDisplay">
                SET <span id="setNumber">1</span>/5
            </div>

            <div class="timer">
                <span id="timer">0.00</span>
                <span>seconds</span>
            </div>


            <!-- LOCK BOARD -->
            <div
                class="lockBoard"
                id="lockBoard">
            </div>


            <!-- MESSAGE -->
            <div
                class="message"
                id="message">
                Find the matching pair!
            </div>


            <!-- SET TIMES -->
            <div class="setTimesBox">

                <div class="setTimesTitle">
                    Set Times
                </div>

                <div id="setTimes"></div>

            </div>


            <!-- FINAL RESULT -->
            <div
                class="finalResult"
                id="finalResult">

                <h2>🏆 Finished!</h2>

                <div id="finalTotal">
                    Total: 0.00 seconds
                </div>

                <div id="finalAverage">
                    Average: 0.00 seconds
                </div>

            </div>


            <!-- RESET -->
            <button
                class="resetButton"
                id="resetButton"
                type="button">
                RESET
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
